<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NotasBeta - Cuadernos y Notas</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="theme-cobalt">
  
  <header class="app-header">
    <div class="header-title">
      <h1>NotasBeta</h1>
    </div>
    
    <!-- Selector de 3 temas -->
    <div class="theme-selector">
      <label for="themeSelect">Tema:</label>
      <select id="themeSelect">
        <option value="cobalt">Cobalto Oscuro</option>
        <option value="dark">Oscuro Puro</option>
        <option value="light">Claro</option>
      </select>
    </div>
  </header>

  <main class="app-container">
    
    <!-- Seccion de Cuadernos -->
    <section class="accordion-section" id="sectionCuadernos">
      <button class="accordion-header" id="btnToggleCuadernos">
        <div class="accordion-title">
          <span>Cuadernos</span>
          <span class="badge" id="badgeCuadernos">0</span>
        </div>
        <span class="arrow-icon">▲</span>
      </button>
      <div class="accordion-content" id="contentCuadernos">
        <div class="cards-grid" id="gridCuadernos"></div>
        <p class="empty-msg" id="emptyCuadernos">No hay cuadernos creados.</p>
      </div>
    </section>

    <!-- Seccion de Notas -->
    <section class="accordion-section" id="sectionNotas">
      <button class="accordion-header" id="btnToggleNotas">
        <div class="accordion-title">
          <span>Notas</span>
          <span class="badge" id="badgeNotas">0</span>
        </div>
        <span class="arrow-icon">▲</span>
      </button>
      <div class="accordion-content" id="contentNotas">
        <div class="cards-grid" id="gridNotas"></div>
        <p class="empty-msg" id="emptyNotas">No hay notas creadas.</p>
      </div>
    </section>

  </main>

  <!-- Boton Flotante Principal (+) -->
  <button class="fab-btn" id="fabAdd" title="Crear o Conectar">+</button>

  <!-- Menu Flotante de Opciones (+) -->
  <div class="fab-menu" id="fabMenu">
    <button class="fab-option" id="btnNewCuaderno">Nuevo Cuaderno</button>
    <button class="fab-option" id="btnNewNota">Nueva Nota</button>
  </div>

  <!-- Modal Personalizado para Crear/Editar Nota (con Portada) -->
  <div class="modal-overlay" id="modalNota">
    <div class="modal-box">
      <h3 id="modalNotaTitle">Nueva Nota</h3>
      <input type="text" id="inputNotaTitle" placeholder="Título de la nota...">
      <input type="text" id="inputNotaCover" placeholder="URL de la imagen de portada (opcional)...">
      <textarea id="inputNotaContent" placeholder="Escribe tu nota aquí..."></textarea>
      <div class="modal-actions">
        <button class="btn-secondary" id="btnCancelNota">Cancelar</button>
        <button class="btn-primary" id="btnSaveNota">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal Personalizado de Confirmacion de Eliminacion (Sustituye al confirm nativo) -->
  <div class="modal-overlay" id="modalConfirm">
    <div class="modal-box modal-confirm-box">
      <h3>¿Eliminar elemento?</h3>
      <p id="confirmMsg">¿Estás seguro de que deseas eliminar esto? Esta acción no se puede deshacer.</p>
      <div class="modal-actions">
        <button class="btn-secondary" id="btnCancelConfirm">Cancelar</button>
        <button class="btn-danger" id="btnAcceptConfirm">Eliminar</button>
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
